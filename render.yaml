services:
  # 1. Daphne ASGI Web Service (REST API + Real-Time WebSockets)
  - type: web
    name: taskflow-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CONN_MAX_AGE
        value: "0"

  # 2. Celery Worker (Background tasks & notifications)
  - type: worker
    name: taskflow-celery-worker
    runtime: docker
    dockerfilePath: Dockerfile.celery
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        fromService:
          name: taskflow-backend
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: taskflow-backend
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: taskflow-backend
          type: web
          envVarKey: REDIS_URL
      - key: EMAIL_HOST_USER
        fromService:
          name: taskflow-backend
          type: web
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          name: taskflow-backend
          type: web
          envVarKey: EMAIL_HOST_PASSWORD
