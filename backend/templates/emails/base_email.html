<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject|default:"TaskFlow Notification" }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 24px;
      color: #1e293b;
    }
    .email-container {
      max-width: 580px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .header {
      background-color: #0f172a;
      padding: 24px 32px;
      border-bottom: 2px solid #2563eb;
    }
    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-decoration: none;
    }
    .brand-accent {
      color: #3b82f6;
    }
    .content {
      padding: 32px;
      line-height: 1.6;
    }
    .action-button {
      display: inline-block;
      margin: 24px 0;
      padding: 12px 24px;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border-radius: 8px;
    }
    .footer {
      padding: 20px 32px;
      background-color: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="header">
      <a href="{{ site_url|default:'http://localhost:5173' }}" class="brand">
        TaskFlow <span class="brand-accent">Enterprise</span>
      </a>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>This is an automated notification from TaskFlow. Manage your alert preferences in your account settings.</p>
      <p>&copy; 2026 TaskFlow Platform &bull; Made with precision by Devam Mandli</p>
    </div>
  </div>
</body>
</html>
