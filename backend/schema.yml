openapi: 3.0.3
info:
  title: TaskFlow API
  version: 1.0.0
  description: Enterprise Scrum & Project Management Platform API
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        POST /api/v1/auth/login/
        Rate-limited (5/min per IP) login endpoint. Sets HttpOnly refresh cookie.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
        '429':
          description: Too many requests
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        POST /api/v1/auth/logout/
        Blacklists the active refresh token and clears the HttpOnly cookie.
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Successfully logged out
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: |-
        GET /api/v1/auth/me/
        Returns the authenticated user's profile.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          description: Authentication credentials were not provided or invalid
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: |-
        POST /api/v1/auth/password-reset/
        Accepts email, generates a secure 24-hour token, and sends a reset email via Gmail SMTP.
        Employs anti-enumeration protection: always returns 200 OK regardless of whether the email exists.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: If this email is registered, a password reset link has been
            dispatched.
        '400':
          description: Invalid request payload
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      description: |-
        POST /api/v1/auth/password-reset/confirm/
        Validates the base64 UID and HMAC token, then atomically updates the user's password.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Password has been successfully reset.
        '400':
          description: Invalid token, expired token, or weak password.
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        POST /api/v1/auth/refresh/
        Reads refresh token from HttpOnly cookie, rotates it, and issues new token pair.
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Tokens rotated successfully
        '401':
          description: Invalid or missing refresh token
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: |-
        POST /api/v1/auth/register/
        Registers a new user, returns in-memory access token, and sets HttpOnly refresh cookie.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
  /api/v1/notifications/:
    get:
      operationId: v1_notifications_list
      description: |-
        List current user's notifications.
        Supports filtering by unread status and workspace.
      summary: List user notifications
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Limit number of notifications returned (default 50)
      - in: query
        name: unread_only
        schema:
          type: boolean
        description: Filter to unread notifications only
      - in: query
        name: workspace_id
        schema:
          type: string
        description: Filter to a specific workspace ID
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/{notification_id}/read/:
    post:
      operationId: v1_notifications_read_create
      description: Marks a single notification as read.
      summary: Mark notification as read
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/notifications/preferences/:
    get:
      operationId: v1_notifications_preferences_list
      description: Retrieve and update user's notification preferences.
      summary: Get user notification preferences
      parameters:
      - in: query
        name: workspace_id
        schema:
          type: string
        description: Optional workspace ID filter
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
          description: ''
    patch:
      operationId: v1_notifications_preferences_partial_update
      description: Retrieve and update user's notification preferences.
      summary: Update notification preference
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferenceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferenceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferenceUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
          description: ''
  /api/v1/notifications/read-all/:
    post:
      operationId: v1_notifications_read_all_create
      description: Marks all notifications for current user as read.
      summary: Mark all notifications as read
      parameters:
      - in: query
        name: workspace_id
        schema:
          type: string
        description: Optional workspace ID filter
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationReadAll'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationReadAll'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationReadAll'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/notifications/unread-count/:
    get:
      operationId: v1_notifications_unread_count_retrieve
      description: Returns the count of unread notifications for badge rendering.
      summary: Get unread notification count
      parameters:
      - in: query
        name: workspace_id
        schema:
          type: string
        description: Optional workspace ID filter
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/v1/workspaces/:
    get:
      operationId: v1_workspaces_list
      description: |-
        GET  /api/v1/workspaces/       - List all workspaces the authenticated user belongs to.
        POST /api/v1/workspaces/       - Create a new workspace (user becomes OWNER).
      summary: List user's active workspaces
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
          description: ''
    post:
      operationId: v1_workspaces_create
      description: |-
        GET  /api/v1/workspaces/       - List all workspaces the authenticated user belongs to.
        POST /api/v1/workspaces/       - Create a new workspace (user becomes OWNER).
      summary: Create a new workspace
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/v1/workspaces/{slug}/:
    get:
      operationId: v1_workspaces_retrieve
      description: |-
        GET   /api/v1/workspaces/{slug}/  - Retrieve workspace details.
        PATCH /api/v1/workspaces/{slug}/  - Update workspace name, description, or settings.
      summary: Get workspace details by slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '403':
          description: Not a member
        '404':
          description: Not found
    patch:
      operationId: v1_workspaces_partial_update
      description: |-
        GET   /api/v1/workspaces/{slug}/  - Retrieve workspace details.
        PATCH /api/v1/workspaces/{slug}/  - Update workspace name, description, or settings.
      summary: Update workspace details (Admin/Owner only)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/v1/workspaces/{slug}/archive/:
    post:
      operationId: v1_workspaces_archive_create
      description: |-
        POST /api/v1/workspaces/{slug}/archive/   - Soft-archive workspace (Owner only).
        POST /api/v1/workspaces/{slug}/unarchive/ - Restore archived workspace (Owner only).
      summary: Archive workspace (Owner only)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Workspace archived
  /api/v1/workspaces/{slug}/invites/:
    get:
      operationId: v1_workspaces_invites_list
      description: |-
        GET  /api/v1/workspaces/{slug}/invites/ - List all invitations for this workspace.
        POST /api/v1/workspaces/{slug}/invites/ - Send an invitation by email.
      summary: List all workspace invitations (Admin/Owner only)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceInvite'
          description: ''
    post:
      operationId: v1_workspaces_invites_create
      description: |-
        GET  /api/v1/workspaces/{slug}/invites/ - List all invitations for this workspace.
        POST /api/v1/workspaces/{slug}/invites/ - Send an invitation by email.
      summary: Invite a user to the workspace by email (Admin/Owner only)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInviteCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceInviteCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceInviteCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: Invite created, returns invite details and raw_token
  /api/v1/workspaces/{slug}/invites/{invite_id}/:
    delete:
      operationId: v1_workspaces_invites_destroy
      description: DELETE /api/v1/workspaces/{slug}/invites/{invite_id}/ - Revoke
        an invitation.
      summary: Revoke an invitation (Admin/Owner only)
      parameters:
      - in: path
        name: invite_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Invite revoked
  /api/v1/workspaces/{slug}/members/:
    get:
      operationId: v1_workspaces_members_list
      description: GET /api/v1/workspaces/{slug}/members/ - List all active members
        of the workspace.
      summary: List all active members of the workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
          description: ''
  /api/v1/workspaces/{slug}/members/{user_id}/:
    patch:
      operationId: v1_workspaces_members_partial_update
      description: |-
        DELETE /api/v1/workspaces/{slug}/members/{user_id}/ - Remove member from workspace.
        PATCH  /api/v1/workspaces/{slug}/members/{user_id}/ - Change member role.
      summary: Update member role (Admin/Owner only)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMemberRoleUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMemberRoleUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMemberRoleUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
          description: ''
    delete:
      operationId: v1_workspaces_members_destroy
      description: |-
        DELETE /api/v1/workspaces/{slug}/members/{user_id}/ - Remove member from workspace.
        PATCH  /api/v1/workspaces/{slug}/members/{user_id}/ - Change member role.
      summary: Remove member from workspace (Admin/Owner only)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Member removed successfully
  /api/v1/workspaces/{slug}/unarchive/:
    post:
      operationId: v1_workspaces_unarchive_create
      description: Restore an archived workspace.
      summary: Unarchive workspace (Owner only)
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Workspace restored
  /api/v1/workspaces/{workspace_slug}/dashboard-summary/:
    get:
      operationId: v1_workspaces_dashboard_summary_retrieve
      description: |-
        GET /api/v1/workspaces/{workspace_slug}/dashboard-summary/
        Delegates to projects analytics engine for executive overview data.
      summary: Get Workspace Dashboard Summary
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Dashboard summary aggregates
  /api/v1/workspaces/{workspace_slug}/projects/:
    get:
      operationId: v1_workspaces_projects_list
      description: |-
        GET  /api/v1/workspaces/{workspace_slug}/projects/ - List all projects user has access to.
        POST /api/v1/workspaces/{workspace_slug}/projects/ - Create a new project.
      summary: List accessible projects in workspace
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: v1_workspaces_projects_create
      description: |-
        GET  /api/v1/workspaces/{workspace_slug}/projects/ - List all projects user has access to.
        POST /api/v1/workspaces/{workspace_slug}/projects/ - Create a new project.
      summary: Create a new project
      parameters:
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/:
    get:
      operationId: v1_workspaces_projects_retrieve
      description: |-
        GET   /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/
        PATCH /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/
      summary: Get project details by slug
      parameters:
      - in: path
        name: project_slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: v1_workspaces_projects_partial_update
      description: |-
        GET   /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/
        PATCH /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/
      summary: Update project details
      parameters:
      - in: path
        name: project_slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/archive/:
    post:
      operationId: v1_workspaces_projects_archive_create
      description: Soft-archive a project.
      summary: Archive project
      parameters:
      - in: path
        name: project_slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Project archived
  /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/backlog/:
    get:
      operationId: v1_workspaces_projects_backlog_list
      description: |-
        GET  /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/backlog/ - List backlog items.
        POST /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/backlog/ - Create backlog work item.
      summary: List prioritized product backlog items
      parameters:
      - in: path
        name: project_slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkItem'
          description: ''
    post:
      operationId: v1_workspaces_projects_backlog_create
      description: |-
        GET  /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/backlog/ - List backlog items.
        POST /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/backlog/ - Create backlog work item.
      summary: Create backlog work item (Story, Task, Bug)
      parameters:
      - in: path
        name: project_slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkItemCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkItemCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItem'
          description: ''
  /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/board/:
    get:
      operationId: v1_workspaces_projects_board_retrieve
      description: |-
        GET /api/v1/workspaces/{workspace_slug}/projects/{project_slug}/board/
        Returns the active sprint data and its work items grouped into swimlane columns.
