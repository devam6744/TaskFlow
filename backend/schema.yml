components:
  schemas:
    AcceptInvite:
      type: object
      description: Input serializer for accepting an invite token.
      properties:
        token:
          type: string
      required:
      - token
    ActivityEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/CollaborationUser'
          readOnly: true
        object_type:
          type: string
          readOnly: true
        object_id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - event_type
      - id
      - metadata
      - object_id
      - object_type
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        work_item:
          type: string
          format: uuid
          readOnly: true
        uploader:
          allOf:
          - $ref: '#/components/schemas/CollaborationUser'
          readOnly: true
        file_url:
          type: string
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - file_url
      - id
      - original_filename
      - size_bytes
      - uploader
      - work_item
    AttachmentUpload:
      type: object
      properties:
        file:
          type: string
