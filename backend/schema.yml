      - expires_at
      - id
      - invited_by
      - role
      - status
    WorkspaceInviteCreate:
      type: object
      description: Input serializer to invite a user by email.
      properties:
        email:
          type: string
          format: email
        role:
          allOf:
          - $ref: '#/components/schemas/Role6f5Enum'
          default: MEMBER
      required:
      - email
    WorkspaceInviteStatusEnum:
      enum:
      - PENDING
      - ACCEPTED
      - REVOKED
      - EXPIRED
      type: string
      description: |-
        * `PENDING` - Pending
        * `ACCEPTED` - Accepted
        * `REVOKED` - Revoked
        * `EXPIRED` - Expired
    WorkspaceMember:
      type: object
      description: Workspace member record with nested user details.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        role:
          $ref: '#/components/schemas/Role6f5Enum'
        status:
          $ref: '#/components/schemas/WorkspaceMemberStatusEnum'
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - joined_at
      - user
    WorkspaceMemberStatusEnum:
      enum:
      - ACTIVE
      - SUSPENDED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `SUSPENDED` - Suspended
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
